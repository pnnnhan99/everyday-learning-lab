name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit and API tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Validate reactions
        run: npm run validate:reactions

      - name: Validate mutations
        run: npm run validate:mutations

      - name: Validate persistence
        run: npm run validate:persistence
